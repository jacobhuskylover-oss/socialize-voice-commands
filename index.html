<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5865F2">

<title>Socialize • Voice Commands</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    background:
        linear-gradient(-45deg,
            #0f172a,
            #1e1b4b,
            #312e81,
            #4f46e5,
            #7c3aed
        );
    background-size:500% 500%;
    animation:bgMove 18s ease infinite;
}

@keyframes bgMove{
    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* =========================
   Glow Background
========================= */

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(170px);
    z-index:-2;
    opacity:.45;
    pointer-events:none;
}

body::before{
    width:450px;
    height:450px;
    background:#5865F2;
    top:-140px;
    left:-120px;
}

body::after{
    width:500px;
    height:500px;
    background:#a855f7;
    bottom:-180px;
    right:-120px;
}

/* =========================
   Floating Particles
========================= */

.particle{
    position:fixed;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:.18;
    animation:float linear infinite;
    pointer-events:none;
    z-index:-1;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(.5);
    }

    100%{
        transform:translateY(-120vh) scale(1.2);
    }
}

/* =========================
   Main Container
========================= */

.container{
    width:100%;
    max-width:950px;
    padding:35px;
    border-radius:24px;
    background:rgba(30,31,34,.72);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:
        0 0 50px rgba(88,101,242,.35),
        0 25px 80px rgba(0,0,0,.3);
}

/* =========================
   Header
========================= */

.header{
    text-align:center;
    margin-bottom:35px;
}

.logo{
    font-size:62px;
    margin-bottom:10px;
    filter:
        drop-shadow(0 0 12px rgba(88,101,242,.8))
        drop-shadow(0 0 30px rgba(168,85,247,.5));
    animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

.header h1{
    font-size:46px;
    font-weight:800;
    background:
        linear-gradient(
            90deg,
            #ffffff,
            #7dd3fc,
            #c084fc,
            #ffffff
        );
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleGradient 5s linear infinite;
}

@keyframes titleGradient{
    0%{
        background-position:0% center;
    }

    100%{
        background-position:250% center;
    }
}

.header p{
    margin-top:10px;
    color:#b5bac1;
    font-size:17px;
}

/* =========================
   Command Table
========================= */

.table{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.row{
    display:grid;
    grid-template-columns:1fr 2fr auto;
    gap:20px;
    align-items:center;
    padding:20px;
    border-radius:16px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.row:hover{
    transform:translateY(-4px) scale(1.01);
    border-color:#5865F2;
    background:rgba(88,101,242,.08);
    box-shadow:
        0 0 25px rgba(88,101,242,.45),
        inset 0 0 20px rgba(88,101,242,.04);
}

/* =========================
   Command Text
========================= */

.command{
    font-family:monospace;
    font-size:20px;
    font-weight:bold;
    color:#57F287;
    text-shadow:0 0 10px rgba(87,242,135,.25);
    white-space:nowrap;
}

.description{
    color:#d7d9dc;
    line-height:1.5;
}

/* =========================
   Copy Button
========================= */

button{
    position:relative;
    overflow:hidden;
    padding:11px 22px;
    border:none;
    border-radius:10px;
    background:
        linear-gradient(
            90deg,
            #5865F2,
            #7c3aed
        );
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:
        transform .25s ease,
        box-shadow .25s ease;
    box-shadow:
        0 0 20px rgba(88,101,242,.4);
}

button::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );
    transition:left .5s ease;
}

button:hover::before{
    left:100%;
}

button:hover{
    transform:scale(1.06);
    box-shadow:
        0 0 35px rgba(88,101,242,.75);
}

button:active{
    transform:scale(.96);
}

/* =========================
   Footer
========================= */

.footer{
    margin-top:35px;
    text-align:center;
    color:#9ca3af;
    font-size:14px;
}

/* =========================
   Toast
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,20px);
    padding:14px 22px;
    background:#57F287;
    color:#111;
    border-radius:12px;
    font-weight:700;
    display:none;
    opacity:0;
    box-shadow:
        0 0 20px rgba(87,242,135,.5);
    z-index:9999;
    transition:
        opacity .25s ease,
        transform .25s ease;
}

.toast.show{
    display:block;
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   Responsive
========================= */

@media(max-width:750px){

    body{
        padding:18px;
        align-items:flex-start;
        padding-top:25px;
    }

    .container{
        padding:24px 18px;
        border-radius:20px;
    }

    .row{
        grid-template-columns:1fr;
        gap:12px;
    }

    .command{
        font-size:18px;
    }

    .description{
        font-size:14px;
    }

    button{
        width:100%;
        padding:12px;
    }

    .header h1{
        font-size:34px;
    }

    .header p{
        font-size:15px;
    }

    .logo{
        font-size:46px;
    }
}

@media(max-width:420px){

    .container{
        padding:20px 14px;
    }

    .header h1{
        font-size:29px;
    }

    .header p{
        font-size:14px;
    }

    .row{
        padding:16px;
    }
}

/* =========================
   Reduced Motion
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>

<body>

<!-- Floating particles -->
<script>
for(let i = 0; i < 40; i++){

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left =
        Math.random() * 100 + "vw";

    particle.style.animationDuration =
        (8 + Math.random() * 12) + "s";

    particle.style.animationDelay =
        (-Math.random() * 15) + "s";

    particle.style.opacity =
        (0.08 + Math.random() * 0.18);

    document.body.appendChild(particle);
}
</script>

<div class="container">

    <div class="header">

        <div class="logo">🎤</div>

        <h1>Socialize Voice Commands</h1>

        <p>
          
        </p>

    </div>

    <div class="table">

        <!-- BAN -->

        <div class="row">

            <div class="command">
                !v ban
            </div>

            <div class="description">
                
            </div>

            <button onclick="copyCommand('!v ban', this)">
                Copy
            </button>

        </div>

        <!-- KICK -->

        <div class="row">

            <div class="command">
                !v kick
            </div>

            <div class="description">
              
            </div>

            <button onclick="copyCommand('!v kick', this)">
                Copy
            </button>

        </div>

        <!-- UNBAN -->

        <div class="row">

            <div class="command">
                !v unban
            </div>

            <div class="description">
              
            </div>

            <button onclick="copyCommand('!v unban', this)">
                Copy
            </button>

        </div>

        <!-- PERMIT -->

        <div class="row">

            <div class="command">
                !v permit
            </div>

            <div class="description">
              
            </div>

            <button onclick="copyCommand('!v permit', this)">
                Copy
            </button>

        </div>

        <!-- UNPERMIT -->

        <div class="row">

            <div class="command">
                !v unpermit
            </div>

            <div class="description">
               
            </div>

            <button onclick="copyCommand('!v unpermit', this)">
                Copy
            </button>

        </div>

        <!-- LOCK -->

        <div class="row">

            <div class="command">
                !v lock
            </div>

            <div class="description">
              
            </div>

            <button onclick="copyCommand('!v lock', this)">
                Copy
            </button>

        </div>

        <!-- UNLOCK -->

        <div class="row">

            <div class="command">
                !v unlock
            </div>

            <div class="description">
            
            </div>

            <button onclick="copyCommand('!v unlock', this)">
                Copy
            </button>

        </div>

       <!-- SIZE -->

        <div class="row">

            <div class="command">
                !v size
            </div>

            <div class="description">
                
            </div>

            <button onclick="copyCommand('!v size', this)">
                Copy
            </button>

        </div>


    <div class="footer">
        ✨ Socialize • Custom Voice Channel Commands
    </div>

</div>

<!-- Toast notification -->

<div id="toast" class="toast">
    ✅ Command copied!
</div>

<script>

/* =========================
   Copy Command
========================= */

async function copyCommand(command, button){

    try{

        await navigator.clipboard.writeText(command);

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = command;

        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        document.execCommand("copy");

        textarea.remove();
    }

    showToast(command);

    if(button){

        const originalText =
            button.textContent;

        button.textContent =
            "✓ Copied";

        setTimeout(() => {

            button.textContent =
                originalText;

        }, 1200);
    }
}


/* =========================
   Toast
========================= */

let toastTimeout;

function showToast(command){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        "✅ " + command + " copied!";

    toast.classList.add("show");

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {

        toast.classList.remove("show");

    }, 1500);
}

</script>

</body>
</html>
